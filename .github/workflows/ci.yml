name: Full-stack checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack/shared-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder:
          - fullstack/shared-typescript
          - fullstack/ecommerce-order-and-inventory-platform-fullstack
          - fullstack/education-learning-and-assessment-portal-fullstack/frontend
          - fullstack/financial-reconciliation-and-exception-workbench-fullstack/frontend
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
